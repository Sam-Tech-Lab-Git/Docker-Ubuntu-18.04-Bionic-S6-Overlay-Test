name: Vulnerability Scan - multi-arch

on:
  workflow_run:
    workflows:
      - "Build & Push - multi-arch"
    types:
      - completed
  schedule:
    - cron: "0 4 * * 1" # chaque lundi à 04h00 UTC
  workflow_dispatch:

concurrency:
  group: vuln-scan-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan-amd64:
    name: Scan amd64
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45

    permissions:
      actions: read
      contents: read
      security-events: write # GitHub Security SARIF upload

    steps:
      - name: Compute version tag
        id: version
        run: |
          TAG=$(date -u +'%Y.%m')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Pull amd64 image locally
        run: docker pull --platform linux/amd64 ghcr.io/sam-tech-lab-git/ubuntu-18.04-bionic:latest

      - name: Scan image for vulnerabilities - SARIF (GitHub Security)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/sam-tech-lab-git/ubuntu-18.04-bionic:latest
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-amd64

      - name: Scan image for vulnerabilities - JSON rapport complet
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/sam-tech-lab-git/ubuntu-18.04-bionic:latest
          format: json
          output: trivy-results.json
          exit-code: '0'
          ignore-unfixed: false
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Upload vulnerability report (JSON artifact)
        uses: actions/upload-artifact@v7
        with:
          name: vulnerability-report-amd64-${{ steps.version.outputs.tag }}
          path: trivy-results.json
          retention-days: 90

      - name: Generate vulnerability step summary
        run: |
          echo "## 🔒 Rapport de vulnérabilités - amd64 - ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image :** \`ghcr.io/sam-tech-lab-git/ubuntu-18.04-bionic:latest\` - \`linux/amd64\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results.json 2>/dev/null || echo 0)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-results.json 2>/dev/null || echo 0)
          MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-results.json 2>/dev/null || echo 0)
          LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-results.json 2>/dev/null || echo 0)
          echo "### Résumé" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Sévérité | Nombre |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 CRITICAL | ${CRITICAL} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 HIGH     | ${HIGH} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 MEDIUM   | ${MEDIUM} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 LOW      | ${LOW} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${CRITICAL}" -gt 0 ] || [ "${HIGH}" -gt 0 ] || [ "${MEDIUM}" -gt 0 ] || [ "${LOW}" -gt 0 ]; then
            echo "### 📋 Détail des vulnérabilités (CRITICAL, HIGH, MEDIUM, LOW)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Paquet | CVE | Sévérité | Version installée | Version corrigée | Description |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-----|----------|-------------------|------------------|-------------|" >> $GITHUB_STEP_SUMMARY
            jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH" or .Severity=="MEDIUM" or .Severity=="LOW") | "| \(.PkgName) | [\(.VulnerabilityID)](https://avd.aquasec.com/nvd/\(.VulnerabilityID | ascii_downcase)) | \(.Severity) | \(.InstalledVersion) | \(.FixedVersion // "N/A") | \(.Title // "") |"' trivy-results.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          else
            echo "✅ Aucune vulnérabilité détectée." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 📦 Le rapport JSON complet est disponible dans les artefacts du workflow (rétention 90 jours)." >> $GITHUB_STEP_SUMMARY
          echo "> 🔍 Le rapport SARIF est visible dans l'onglet **Security → Code scanning** du dépôt GitHub." >> $GITHUB_STEP_SUMMARY

  scan-arm64:
    name: Scan arm64
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    permissions:
      actions: read
      contents: read
      security-events: write # GitHub Security SARIF upload

    steps:
      - name: Compute version tag
        id: version
        run: |
          TAG=$(date -u +'%Y.%m')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Set up QEMU for arm64 emulation
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Pull arm64 image locally
        run: docker pull --platform linux/arm64 ghcr.io/sam-tech-lab-git/ubuntu-18.04-bionic:latest

      - name: Scan image for vulnerabilities - SARIF (GitHub Security)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/sam-tech-lab-git/ubuntu-18.04-bionic:latest
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM

      - name: Upload SARIF to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-arm64

      - name: Scan image for vulnerabilities - JSON rapport complet
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          image-ref: ghcr.io/sam-tech-lab-git/ubuntu-18.04-bionic:latest
          format: json
          output: trivy-results.json
          exit-code: '0'
          ignore-unfixed: false
          severity: CRITICAL,HIGH,MEDIUM,LOW

      - name: Upload vulnerability report (JSON artifact)
        uses: actions/upload-artifact@v7
        with:
          name: vulnerability-report-arm64-${{ steps.version.outputs.tag }}
          path: trivy-results.json
          retention-days: 90

      - name: Generate vulnerability step summary
        run: |
          echo "## 🔒 Rapport de vulnérabilités - arm64 - ${{ steps.version.outputs.tag }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Image :** \`ghcr.io/sam-tech-lab-git/ubuntu-18.04-bionic:latest\` - \`linux/arm64\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          CRITICAL=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL")] | length' trivy-results.json 2>/dev/null || echo 0)
          HIGH=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="HIGH")] | length' trivy-results.json 2>/dev/null || echo 0)
          MEDIUM=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="MEDIUM")] | length' trivy-results.json 2>/dev/null || echo 0)
          LOW=$(jq '[.Results[]?.Vulnerabilities[]? | select(.Severity=="LOW")] | length' trivy-results.json 2>/dev/null || echo 0)
          echo "### Résumé" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Sévérité | Nombre |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔴 CRITICAL | ${CRITICAL} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟠 HIGH     | ${HIGH} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🟡 MEDIUM   | ${MEDIUM} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔵 LOW      | ${LOW} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ "${CRITICAL}" -gt 0 ] || [ "${HIGH}" -gt 0 ] || [ "${MEDIUM}" -gt 0 ] || [ "${LOW}" -gt 0 ]; then
            echo "### 📋 Détail des vulnérabilités (CRITICAL, HIGH, MEDIUM, LOW)" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Paquet | CVE | Sévérité | Version installée | Version corrigée | Description |" >> $GITHUB_STEP_SUMMARY
            echo "|--------|-----|----------|-------------------|------------------|-------------|" >> $GITHUB_STEP_SUMMARY
            jq -r '.Results[]?.Vulnerabilities[]? | select(.Severity=="CRITICAL" or .Severity=="HIGH" or .Severity=="MEDIUM" or .Severity=="LOW") | "| \(.PkgName) | [\(.VulnerabilityID)](https://avd.aquasec.com/nvd/\(.VulnerabilityID | ascii_downcase)) | \(.Severity) | \(.InstalledVersion) | \(.FixedVersion // "N/A") | \(.Title // "") |"' trivy-results.json >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          else
            echo "✅ Aucune vulnérabilité détectée." >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> 📦 Le rapport JSON complet est disponible dans les artefacts du workflow (rétention 90 jours)." >> $GITHUB_STEP_SUMMARY
          echo "> 🔍 Le rapport SARIF est visible dans l'onglet **Security → Code scanning** du dépôt GitHub." >> $GITHUB_STEP_SUMMARY
