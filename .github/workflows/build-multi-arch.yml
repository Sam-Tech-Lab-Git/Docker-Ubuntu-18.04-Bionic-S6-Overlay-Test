name: Build & Push - multi-arch

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile-multi-arch'
  schedule:
    - cron: "0 3 1 * *" # chaque 1er du mois à 03h00 UTC
  workflow_dispatch:

concurrency:
  group: build-multi-arch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Run hadolint
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf
        with:
          dockerfile: Dockerfile-multi-arch
          failure-threshold: error

  build-multi-arch:
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version tag
        id: version
        run: |
          TAG=$(date -u +'%Y.%m')
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      - name: Build and push multi-arch to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile-multi-arch
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            REPO_URL=https://github.com/${{ github.repository }}
            AUTHORS=Sam Tech Lab
            TITLE=Ubuntu 18.04 (Bionic) Base
            DESCRIPTION=Image Ubuntu 18.04 légère, durcie et multi-architecture
            VERSION=18.04
            LICENSES=MIT
          tags: |
            samtechrepo/ubuntu-18.04-bionic:latest
            samtechrepo/ubuntu-18.04-bionic:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor="Sam Tech Lab"
            org.opencontainers.image.url="https://hub.docker.com/r/samtechrepo/ubuntu-18.04-bionic"

      - name: Build and push multi-arch to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile-multi-arch
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            REPO_URL=https://github.com/${{ github.repository }}
            AUTHORS=Sam Tech Lab
            TITLE=Ubuntu 18.04 (Bionic) Base
            DESCRIPTION=Image Ubuntu 18.04 légère, durcie et multi-architecture
            VERSION=18.04
            LICENSES=MIT
          tags: |
            ghcr.io/sam-tech-lab-git/ubuntu-18.04-bionic:latest
            ghcr.io/sam-tech-lab-git/ubuntu-18.04-bionic:${{ steps.version.outputs.tag }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor="Sam Tech Lab"
            org.opencontainers.image.url="https://ghcr.io/${{ github.repository_owner }}/ubuntu-18.04-bionic"

      - name: Sync README to Docker Hub
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: samtechrepo/ubuntu-18.04-bionic
          readme-filepath: ./README.md