name: Build & Push - multi-arch

on:
  push:
    branches: [ main ]
    paths:
      - 'Dockerfile-multi-arch'
      - 'root/**'
  # Les PR ne publient pas d'image : elles font tourner le lint et les
  # tests d'intégration. Sans cela, une PR ne touchant que
  # .github/workflows/** (typiquement Dependabot) serait mergeable sans
  # qu'aucune CI n'ait validé les nouvelles versions d'actions.
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 3 1 * *" # chaque 1er du mois à 03h00 UTC
  workflow_dispatch:

concurrency:
  group: build-multi-arch-${{ github.ref }}
  cancel-in-progress: false

env:
  # GHCR exige un chemin en minuscules ; github.repository_owner ne l'est
  # pas, d'où la valeur littérale.
  GHCR_IMAGE: ghcr.io/sam-tech-lab-git/ubuntu-18.04-bionic-s6
  DOCKERHUB_IMAGE: samtechlab/ubuntu-18.04-bionic-s6

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run hadolint
        uses: hadolint/hadolint-action@2a66e89f53d0771bb131a7fa31f3136336094aa6 # v3.4.0
        with:
          dockerfile: Dockerfile-multi-arch
          failure-threshold: error

      - name: Lint des scripts d'init s6 (shellcheck)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck -s sh root/etc/s6-overlay/scripts/*

      # Docker Hub refuse une description de plus de 25 000 octets. Sans ce
      # test, le dépassement ne se voit qu'à la toute dernière étape d'une
      # publication, une fois le build multi-arch terminé : l'image part,
      # la description reste celle d'avant, et rien ne le signale ailleurs
      # que dans les logs. On mesure en octets, pas en caractères — les
      # accents comptent double en UTF-8.
      - name: La description Docker Hub tient sous la limite
        run: |
          LIMIT=25000
          SIZE=$(wc -c < README-dockerhub.md)
          echo "README-dockerhub.md : ${SIZE} octets (limite ${LIMIT})"
          if [ "${SIZE}" -gt "${LIMIT}" ]; then
            echo "::error::README-dockerhub.md dépasse la limite Docker Hub de $((SIZE - LIMIT)) octets. Allégez-le, ou déplacez la section concernée vers README.md."
            exit 1
          fi

  test:
    name: Test d'intégration s6-overlay (${{ matrix.arch }})
    needs: lint
    runs-on: ubuntu-latest
    timeout-minutes: 45

    strategy:
      # Une architecture en échec ne doit pas masquer l'état de l'autre.
      fail-fast: false
      matrix:
        arch: [amd64, arm64]

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # L'arm64 est construit et exécuté sous émulation. Le surcoût est
      # modeste — deux à trois minutes de build, mesurées sur les runs
      # existants — au regard de ce qu'il couvre : sans lui, la moitié de
      # la matrice publiée n'aurait jamais vu un processus démarrer.
      - name: Set up QEMU (émulation arm64)
        if: matrix.arch == 'arm64'
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Une seule architecture par job, chargée dans le démon Docker
      # local : on veut pouvoir exécuter l'image, pas seulement la
      # construire.
      - name: Build de l'image de test (${{ matrix.arch }}, local)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile-multi-arch
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: s6-test:ci

      # Les tests ci-dessous n'indiquent pas de plateforme : ils portent
      # sur l'unique image locale. On vérifie donc ici que c'est bien
      # celle qu'on croit, faute de quoi le job arm64 testerait de l'amd64
      # en le présentant comme une couverture des deux architectures.
      - name: L'image construite est bien en ${{ matrix.arch }}
        run: |
          ARCH=$(docker image inspect --format '{{.Architecture}}' s6-test:ci)
          echo "architecture de l'image = ${ARCH}"
          test "${ARCH}" = "${{ matrix.arch }}"

      # Chaque test vérifie une propriété que s6-overlay est censé
      # apporter. Un échec ici bloque la publication de l'image.
      - name: s6 tourne bien en PID 1
        run: |
          PID1=$(docker run --rm s6-test:ci sh -c 'cat /proc/1/comm' | tail -n 1)
          echo "PID 1 = ${PID1}"
          test "${PID1}" = "s6-svscan"

      # Régression : les traces des scripts d'init doivent aller sur
      # stderr. Si elles atterrissent sur stdout, tout usage du type
      # `docker run image cmd | ...` devient inexploitable.
      - name: stdout du CMD non pollué par les traces d'init
        run: |
          OUT=$(docker run --rm s6-test:ci sh -c 'echo MARQUEUR' 2>/dev/null)
          echo "stdout brut = [${OUT}]"
          test "${OUT}" = "MARQUEUR"

      - name: PUID/PGID par défaut (1000:1000)
        run: |
          OUT=$(docker run --rm s6-test:ci sh -c 'echo "$(id -u appuser):$(id -g appuser)"' | tail -n 1)
          echo "appuser = ${OUT}"
          test "${OUT}" = "1000:1000"

      - name: PUID/PGID remappés dynamiquement à l'exécution
        run: |
          OUT=$(docker run --rm -e PUID=1500 -e PGID=1600 s6-test:ci \
                  sh -c 'echo "$(id -u appuser):$(id -g appuser)"' | tail -n 1)
          echo "appuser remappé = ${OUT}"
          test "${OUT}" = "1500:1600"

      - name: /config appartient bien à appuser après remappage
        run: |
          OUT=$(docker run --rm -e PUID=1500 -e PGID=1600 s6-test:ci \
                  stat -c '%u:%g' /config | tail -n 1)
          echo "/config = ${OUT}"
          test "${OUT}" = "1500:1600"

      - name: Le CMD par défaut abandonne les privilèges
        run: |
          OUT=$(docker run --rm s6-test:ci /command/s6-setuidgid appuser id -un | tail -n 1)
          echo "utilisateur du CMD = ${OUT}"
          test "${OUT}" = "appuser"

      - name: Le code de sortie du CMD est propagé au conteneur
        run: |
          set +e
          docker run --rm s6-test:ci sh -c 'exit 42'
          CODE=$?
          set -e
          echo "code de sortie = ${CODE}"
          test "${CODE}" -eq 42

      # Vérifie S6_BEHAVIOUR_IF_STAGE2_FAILS=2 : un PUID invalide doit
      # arrêter le conteneur, pas le laisser démarrer silencieusement.
      - name: Un PUID invalide arrête le conteneur (fail-fast)
        run: |
          set +e
          OUT=$(docker run --rm -e PUID=not-a-number s6-test:ci sh -c 'echo DEMARRE' 2>&1)
          CODE=$?
          set -e
          echo "sortie : ${OUT}"
          echo "code de sortie = ${CODE}"
          test "${CODE}" -ne 0
          echo "${OUT}" | grep -q "PUID invalide"

      # PUID=0 est un entier valide pour usermod, mais c'est root :
      # l'accepter ferait d'appuser un second compte root, et le CMD par
      # défaut s'exécuterait en root sans le moindre message.
      - name: PUID=0 est refusé (appuser ne peut pas devenir root)
        run: |
          set +e
          OUT=$(docker run --rm -e PUID=0 s6-test:ci sh -c 'echo DEMARRE' 2>&1)
          CODE=$?
          set -e
          echo "sortie : ${OUT}"
          echo "code de sortie = ${CODE}"
          test "${CODE}" -ne 0
          echo "${OUT}" | grep -q "PUID invalide"

  build-multi-arch:
    needs: test
    # Ne jamais publier depuis une PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 90

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU (cross-arch emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Ce dépôt étant un banc d'essai, les secrets Docker Hub n'y sont
      # pas forcément configurés. On teste leur présence pour rendre la
      # publication Docker Hub optionnelle, au lieu de faire échouer
      # tout le workflow. GHCR, lui, utilise le GITHUB_TOKEN et
      # fonctionne toujours.
      - name: Les identifiants Docker Hub sont-ils disponibles ?
        id: dockerhub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -n "${DOCKERHUB_USERNAME}" ] && [ -n "${DOCKERHUB_TOKEN}" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
            echo "Secrets Docker Hub présents : publication activée."
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Secrets Docker Hub absents, publication Docker Hub ignorée (GHCR reste actif)."
          fi

      - name: Log in to Docker Hub
        if: steps.dockerhub.outputs.available == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute version tag
        id: version
        run: |
          TAG=$(date -u +'%Y.%m')
          BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "build_date=${BUILD_DATE}" >> $GITHUB_OUTPUT

      # Les tags des deux registres sont donnés à une seule construction.
      # Docker Hub n'entre dans la liste que si ses secrets sont présents ;
      # sans cela, buildx tenterait un push non authentifié et échouerait.
      - name: Composer la liste des tags
        id: tags
        run: |
          {
            echo 'list<<TAGS_EOF'
            echo "${GHCR_IMAGE}:latest"
            echo "${GHCR_IMAGE}:${{ steps.version.outputs.tag }}"
            if [ "${{ steps.dockerhub.outputs.available }}" = "true" ]; then
              echo "${DOCKERHUB_IMAGE}:latest"
              echo "${DOCKERHUB_IMAGE}:${{ steps.version.outputs.tag }}"
            fi
            echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"

      # Une seule construction pour les deux registres. Les deux étapes
      # précédentes produisaient deux images distinctes : les couches
      # étaient identiques grâce au cache, mais chacune portait un label
      # `url` différent, donc une config différente, donc un digest
      # différent. `docker pull` sur GHCR et sur Docker Hub ne rendait pas
      # la même image, ce qui vide de son sens l'épinglage par digest que
      # le README recommande.
      #
      # Conséquence assumée : `org.opencontainers.image.url` ne peut plus
      # désigner un registre en particulier. Il pointe donc vers le dépôt,
      # seule adresse valable pour les deux.
      - name: Build and push multi-arch
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile-multi-arch
          platforms: linux/amd64,linux/arm64
          push: true
          # Attestations jointes au manifeste. La provenance était déjà
          # produite par défaut ; `mode=max` y ajoute les étapes de build et
          # les sources. Le SBOM, lui, manquait — c'est ce qui permet à un
          # utilisateur d'auditer les paquets sans reconstruire l'image, et
          # cela compte d'autant plus sur une base qui ne reçoit plus de
          # correctifs.
          sbom: true
          provenance: mode=max
          build-args: |
            BUILD_DATE=${{ steps.version.outputs.build_date }}
            REPO_URL=https://github.com/${{ github.repository }}
            AUTHORS=Sam Tech Lab
            TITLE=Ubuntu 18.04 (Bionic) Base - s6-overlay
            DESCRIPTION=Image Ubuntu 18.04 légère, durcie et multi-architecture, avec s6-overlay comme PID 1
            VERSION=18.04
            LICENSES=MIT
          tags: ${{ steps.tags.outputs.list }}
          # Pas de guillemets autour des valeurs : chaque ligne est passée
          # telle quelle à `--label`, et buildx découpe au premier `=` sans
          # rien retirer. Des guillemets ici se retrouvent dans la valeur
          # publiée.
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.vendor=Sam Tech Lab
            org.opencontainers.image.url=https://github.com/${{ github.repository }}

      # Vérifie que ce qui vient d'être publié est bien un manifeste
      # contenant les deux architectures, et que les registres servent le
      # même digest — la propriété que la fusion ci-dessus vise à rétablir.
      # Vérifie que ce qui vient d'être publié est bien un manifeste
      # couvrant les deux architectures, et que tous les registres servent
      # le même digest — la propriété que la fusion ci-dessus rétablit.
      # Le digest est recalculé depuis le manifeste brut plutôt que lu via
      # `--format`, qui irait chercher le blob de config sans raison.
      - name: Le manifeste publié couvre les deux architectures
        run: |
          REF_DIGEST=""
          for IMG in $(echo "${{ steps.tags.outputs.list }}" | grep ':latest$'); do
            RAW=$(docker buildx imagetools inspect --raw "${IMG}")
            ARCHES=$(echo "${RAW}" | jq -r '[.manifests[].platform.architecture] | unique | join(" ")')
            DIGEST="sha256:$(printf '%s' "${RAW}" | sha256sum | cut -d' ' -f1)"
            echo "${IMG}"
            echo "  architectures : ${ARCHES}"
            echo "  digest        : ${DIGEST}"
            for WANT in amd64 arm64; do
              if ! echo "${ARCHES}" | tr ' ' '\n' | grep -qx "${WANT}"; then
                echo "::error::${IMG} ne contient pas d'image ${WANT}."
                exit 1
              fi
            done
            if [ -z "${REF_DIGEST}" ]; then
              REF_DIGEST="${DIGEST}"
            elif [ "${DIGEST}" != "${REF_DIGEST}" ]; then
              echo "::error::Les registres ne servent pas le même digest (${REF_DIGEST} vs ${DIGEST})."
              exit 1
            fi
          done
          echo "Tous les registres servent ${REF_DIGEST}."

      # Les guillemets dans un bloc `labels:` ne sont pas des délimiteurs :
      # ils finissent dans la valeur publiée. Le défaut est silencieux — il
      # ne se voit qu'en inspectant l'image — d'où cette vérification, qui
      # sert autant de garde-fou que de trace lisible dans les logs.
      - name: Les labels OCI ne portent pas de guillemets parasites
        run: |
          docker pull -q "${GHCR_IMAGE}:latest"
          LABELS=$(docker image inspect --format '{{json .Config.Labels}}' "${GHCR_IMAGE}:latest")
          echo "${LABELS}" | jq .
          if echo "${LABELS}" | jq -e 'to_entries[] | select(.value | test("^\"|\"$"))' >/dev/null; then
            echo "::error::Au moins un label est publié avec des guillemets littéraux ; retirez-les du bloc labels:."
            exit 1
          fi
          echo "Aucun label encadré de guillemets."
